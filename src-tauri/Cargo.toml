[package]
name = "im-robot"
version = "1.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "im_robot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["speech-recognition", "wasm-plugins"]
speech-recognition = ["dep:sherpa-onnx", "dep:bzip2", "dep:tar"]
wasm-plugins = ["dep:wasmtime", "dep:wasmtime-wasi"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# HTTP 全链路集成测试：mock 模型服务边界，验证 SSE 流式解析与工具调用回传。
wiremock = "0.6"
# 进程内 mock AppHandle，无需真实窗口即可执行沙箱插件。
tauri = { version = "2", features = ["test"] }
# 把 WAT 现场编译成 wasm 字节码，供沙箱插件确定性用例使用。
wat = "1"

[dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
getrandom = "0.3"
sha2 = "0.10"
lopdf = "0.42"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
parking_lot = "0.12"
tempfile = "3"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "multipart", "native-tls", "stream", "system-proxy"] }
futures-util = "0.3"
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
# 常驻语音助手的麦克风采集（rodio 已传递依赖 cpal 0.16，这里显式声明不引入第二份编译）。
cpal = "0.16"
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"], optional = true }
bzip2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }
tauri-plugin-notification = "^2"
tauri-plugin-autostart = "^2"
xcap = "0.9.8"
base64 = "0.22"
tauri-plugin-dialog = "^2"
# rusqlite 0.41 起默认开启 wasm 版 sqlite（sqlite-wasm-rs），桌面端只用 bundled C SQLite：
# 显式关闭默认特性，保持与 0.37 一致的 feature 集合（cache/bundled/backup）；
# fallible_uint 恢复 u64/usize 的 ToSql/FromSql（0.41 起转为可选特性，越界时报错而非截断）。
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "backup", "cache", "fallible_uint"] }
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
wasmtime = { version = "50.0.3", optional = true }
wasmtime-wasi = { version = "50.0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"
core-graphics = "0.23"
objc2-foundation = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Upstream 1.13.8 still requires zip 2; keep the FFI unchanged and upgrade
# its archive reader and HTTPS downloader until upstream ships fixed dependencies.
[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }

xcap = { path = "vendor/xcap" }

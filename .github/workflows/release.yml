name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Prepare: delete auto-created release, create fresh draft
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      releaseId: ${{ steps.create_release.outputs.releaseId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Delete auto-created release and create draft
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          # Delete any auto-created release
          echo "Looking for existing release: $TAG"
          EXISTING_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId' 2>/dev/null || echo "")
          if [ -n "$EXISTING_ID" ]; then
            echo "Found release ID: $EXISTING_ID, deleting..."
            gh api -X DELETE "repos/$REPO/releases/$EXISTING_ID"
            echo "Deleted auto-created release"
            sleep 2
          fi

          # Create a fresh draft release
          echo "Creating draft release for $TAG..."
          RELEASE_BODY="See the assets to download this version and install."
          RELEASE_ID=$(echo "{\"tag_name\":\"$TAG\",\"name\":\"Piko ${{ steps.version.outputs.version }}\",\"body\":\"$RELEASE_BODY\",\"draft\":true,\"prerelease\":false}" | gh api "repos/$REPO/releases" --input - --jq '.id')

          echo "Created release ID: $RELEASE_ID"
          echo "releaseId=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          echo "Uploading assets to release $TAG..."

          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/rpm/*.rpm
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No bundle files found!"
            find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle directory"
            exit 1
          fi

          echo "Found ${#FILES[@]} files to upload:"
          for f in "${FILES[@]}"; do
            echo "  - $f"
          done

          gh release upload "$TAG" "${FILES[@]}" --clobber
          echo "Upload complete!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

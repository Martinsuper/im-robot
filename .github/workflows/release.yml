name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Prepare: delete auto-created release, create fresh draft
  prepare:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      releaseId: ${{ steps.create_release.outputs.releaseId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag does not match package version: $GITHUB_REF_NAME vs v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Create draft release (abort if already published)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          REPO="${{ github.repository }}"

          echo "Looking for existing release: $TAG"
          EXISTING=$(gh api "repos/$REPO/releases/tags/$TAG" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            EXISTING_ID=$(echo "$EXISTING" | jq -r '.id')
            IS_DRAFT=$(echo "$EXISTING" | jq -r '.draft')
            if [ "$IS_DRAFT" != "true" ]; then
              echo "release $TAG 已存在且已发布（id=$EXISTING_ID），中止以避免误删正式版。"
              echo "如确需重建，请先在 GitHub 上手动删除该 release 或删除对应 tag。"
              exit 1
            fi
            echo "Found draft release ID: $EXISTING_ID, deleting..."
            gh api -X DELETE "repos/$REPO/releases/$EXISTING_ID"
            echo "Deleted draft release"
            sleep 2
          fi

          # Create a published release
          echo "Creating release for $TAG..."
          RELEASE_BODY="See the assets to download this version and install."
          RELEASE_ID=$(echo "{\"tag_name\":\"$TAG\",\"name\":\"Piko ${{ steps.version.outputs.version }}\",\"body\":\"$RELEASE_BODY\",\"draft\":true,\"prerelease\":false}" | gh api "repos/$REPO/releases" --input - --jq '.id')

          echo "Created release ID: $RELEASE_ID"
          echo "releaseId=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libxtst-dev libxi-dev libxcb-randr0-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify packaged native agent runtime
        run: |
          npm run agent:prepare
          npm run smoke:runtime

      - name: Build Tauri app
        run: npx tauri build

      - name: Generate installer checksums
        run: node scripts/release-checksums.mjs

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          echo "Uploading assets to release $TAG..."

          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/*/*.sha256
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No bundle files found!"
            find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle directory"
            exit 1
          fi

          echo "Found ${#FILES[@]} files to upload:"
          for f in "${FILES[@]}"; do
            echo "  - $f"
          done

          gh release upload "$TAG" "${FILES[@]}" --clobber
          echo "Upload complete!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/*/*.sha256
          if-no-files-found: warn

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish fully uploaded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: gh release edit "$TAG" --draft=false

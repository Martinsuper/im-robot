name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Tauri CLI
        run: cargo install cargo-binstall && cargo binstall --no-confirm tauri-cli@2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Build release
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect macOS artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p upload
          cp src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg upload/ 2>/dev/null || true

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi upload/ -ErrorAction SilentlyContinue
          Copy-Item src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe upload/ -ErrorAction SilentlyContinue

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p upload
          cp src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb upload/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm upload/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage upload/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: upload/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## macOS 安装指南

            下载 `.dmg` 后拖入 `Applications`，首次打开若提示"已损坏，无法打开"，请执行以下**任一**方法：

            ### 方法一：右键打开（推荐）

            在 Finder 中**右键/双指点击** Piko.app → 选择"打开" → 弹窗中再点"打开"

            ### 方法二：终端命令

            打开终端（`/Applications/Utilities/Terminal.app`），复制以下命令并回车：

            ```bash
            xattr -cr /Applications/Piko.app
            ```

            > 只需执行一次，之后双击即可正常打开。

            ---

            - **Windows**: 直接安装 `.msi` 或 `.exe`
            - **Linux**: 安装 `.deb` / `.rpm` / `.AppImage`
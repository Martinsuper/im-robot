name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Build installers while verification runs; only publish after both succeed.
  # Preparing a draft does not expose an incomplete release to users.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      releaseId: ${{ steps.create_release.outputs.releaseId }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag does not match package version: $GITHUB_REF_NAME vs v$VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create or resume draft release (abort if already published)
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/prepare-release.mjs

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, macos-15-intel, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/install-linux-build-deps.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify packaged native agent runtime
        run: |
          npm run agent:prepare
          npm run smoke:runtime

      - name: Build Tauri app (macOS app before signing)
        if: runner.os == 'macOS'
        run: npx tauri build --bundles app

      - name: Sign and package macOS app
        if: runner.os == 'macOS'
        run: node scripts/package-macos.mjs

      - name: Build Tauri app (Linux and Windows)
        if: runner.os != 'macOS'
        run: npx tauri build

      - name: Generate installer checksums
        run: node scripts/release-checksums.mjs

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${{ needs.prepare.outputs.version }}"
          echo "Uploading assets to release $TAG..."

          shopt -s nullglob
          FILES=(
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/*/*.sha256
          )

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "ERROR: No bundle files found!"
            find src-tauri/target/release/bundle -type f 2>/dev/null || echo "No bundle directory"
            exit 1
          fi

          echo "Found ${#FILES[@]} files to upload:"
          for f in "${FILES[@]}"; do
            echo "  - $f"
          done

          gh release upload "$TAG" "${FILES[@]}" --clobber
          echo "Upload complete!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piko-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/macos/*.app.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/*/*.sha256
          if-no-files-found: warn

  publish:
    needs: [verify, prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish fully uploaded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: gh release edit "$TAG" --draft=false

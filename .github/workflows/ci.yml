name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    # Playwright's OS support must be reviewed before changing this image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agent/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/contracts -> target
          key: contracts
      - run: npm ci
      - run: node --test scripts/prepare-release.test.mjs
      - run: node --test scripts/window-config.test.mjs
      - run: node --test scripts/ci-workflow.test.mjs
      - run: node --test scripts/sherpa-cache.test.mjs
      - run: npm audit
      - run: cargo test --manifest-path tools/contracts/Cargo.toml
      - run: npm run check
      - run: npm run lint
      - run: npm run test
      - run: npm --prefix agent ci
      - run: npm --prefix agent audit
      - run: npm run test:agent
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: verify-native-cache-v2-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install Agent SDK test dependencies
        run: npm --prefix agent ci
      - run: npm run agent:prepare
      - run: npm run smoke:runtime
      - run: npm run test:agent:packaged
      - name: macOS native bridges
        if: runner.os == 'macOS'
        run: |
          npm run test:calendar
          npm run test:notifications-native
          cargo test --manifest-path src-tauri/vendor/xcap/Cargo.toml --lib --target-dir src-tauri/target
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-build-deps.sh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: src-tauri
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/contracts -> target
          cache-targets: false
          key: cargo-audit-0.22.2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
      - run: cargo audit --file tools/contracts/Cargo.lock

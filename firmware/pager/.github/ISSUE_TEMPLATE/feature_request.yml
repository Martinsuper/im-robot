name: 功能建议 / Feature request
description: 新模式、新按键操作、界面改进等
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: 想要什么 / What would you like
      description: 用在什么场景，按哪个键、期望发生什么
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: 涉及的设备 / Devices involved
      placeholder: iPhone 相机、安卓抖音、文石 NeoReader …
  - type: textarea
    id: notes
    attributes:
      label: 补充 / Anything else
